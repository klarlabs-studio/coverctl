version: 1
policy:
  default:
    min: 80
  domains:
    - name: cmd
      match:
        - "./cmd/coverctl/..."
      min: 0  # Entry point, minimal logic
    - name: root
      match:
        - "./"
      min: 0  # Entry point main.go, minimal logic
    - name: cli
      match:
        - "./internal/cli/..."
      min: 55
    - name: application
      match:
        - "./internal/application/..."
      min: 45
    - name: domain
      match:
        - "./internal/domain/..."
    - name: mcp
      match:
        - "./internal/mcp/..."
      min: 60
    - name: eval
      match:
        - "./internal/eval/..."
      min: 50
    - name: pathutil
      match:
        - "./internal/pathutil/..."
      min: 90
    - name: autodetect
      match:
        - "./internal/infrastructure/autodetect/..."
      min: 65
    - name: config
      match:
        - "./internal/infrastructure/config/..."
      min: 70
    - name: coverprofile
      match:
        - "./internal/infrastructure/coverprofile/..."
    - name: gotool
      match:
        - "./internal/infrastructure/gotool/..."
      min: 55
    - name: report
      match:
        - "./internal/infrastructure/report/..."
      min: 65
    - name: annotations
      match:
        - "./internal/infrastructure/annotations/..."
    - name: diff
      match:
        - "./internal/infrastructure/diff/..."
    - name: wizard
      match:
        - "./internal/infrastructure/wizard/..."
    - name: runners
      match:
        - "./internal/infrastructure/runners/..."
      min: 55
    - name: parsers
      match:
        - "./internal/infrastructure/parsers/..."
      min: 75
    - name: history
      match:
        - "./internal/infrastructure/history/..."
      min: 70
    - name: paths
      match:
        - "./internal/infrastructure/paths/..."
      min: 90
    - name: resolver
      match:
        - "./internal/infrastructure/resolver/..."
      min: 80
    - name: badge
      match:
        - "./internal/infrastructure/badge/..."
      min: 90
    - name: providers
      match:
        - "./internal/infrastructure/github/..."
        - "./internal/infrastructure/gitlab/..."
        - "./internal/infrastructure/bitbucket/..."
      min: 85
    - name: cmdrun
      match:
        - "./internal/infrastructure/cmdrun/..."
      min: 80
    - name: watcher
      match:
        - "./internal/infrastructure/watcher/..."
      min: 80
