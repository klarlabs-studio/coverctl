# Starter template — copy to .coverctl.yaml and adjust.
# Domains group source paths (not language packages).
#   Most languages: path globs  →  match: ["src/api/**"]
#   Go: package paths          →  match: ["./internal/api/..."]
# See docs: configuration/domains
version: 1
policy:
  default:
    min: 80
  domains:
    - name: core
      match:
        - "src/core/**"
        # Go projects typically use: "./internal/core/..."
exclude:
  - "**/generated/**"
files:
  - match:
      - "src/core/*"
    min: 90
diff:
  enabled: false
  base: "origin/main"
integration:
  enabled: false
  packages:
    - "./internal/integration/..."
  run_args:
    - "-test.run"
    - "TestIntegration"
  cover_dir: ".cover/integration"
  profile: ".cover/integration.out"
merge:
  profiles:
    - ".cover/unit.out"
    - ".cover/integration.out"
annotations:
  enabled: true
