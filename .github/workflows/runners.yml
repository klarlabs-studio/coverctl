# Runners unit tests
#
# Focused gate for language-runner Detect/buildArgs changes. Full polyglot
# toolchain smoke (pytest-cov, nyc, cargo-llvm-cov, …) stays optional —
# these tests are mocked and do not require language runtimes on the runner.
name: Runners

on:
  pull_request:
    paths:
      - "internal/infrastructure/runners/**"
      - "internal/application/types.go"
      - ".github/workflows/runners.yml"
  push:
    branches: [main]
    paths:
      - "internal/infrastructure/runners/**"
      - "internal/application/types.go"
      - ".github/workflows/runners.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runners:
    name: Runners unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test runners package
        run: go test ./internal/infrastructure/runners/ -count=1
