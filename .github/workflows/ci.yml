# Thin caller for the shared klarlabs-studio Go CI bar.
# All gate logic (race tests, lint+gocritic, nox security scan, build,
# dependency review) lives in the reusable workflow — bump versions / add
# jobs there, once, org-wide. Pin the reusable workflow to a commit SHA
# (not @main) so CI is immutable supply-chain infrastructure.
#
# coverage: false here is deliberate. The reusable's coverage gate installs
# `go.klarlabs.de/coverctl@latest` (a released binary) to gate a repo. coverctl
# IS that tool, so gating it with a previously-released build instead of the PR
# source defeats dogfooding (a PR changing the gate logic would not be checked
# by its own new logic). coverctl keeps its self-dogfood coverage gate in
# coverage.yml, which builds `coverctl` from the PR source and runs it against
# itself. See PR description for the full rationale.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    # No paths-ignore here: branch protection requires this workflow's status
    # checks (ci / Lint, Test, Build, Security (nox)), and a docs-only PR that
    # skips the whole workflow never reports them — so the PR is unmergeable
    # forever without an admin override. Running CI on docs PRs is cheap (no
    # code changed → cache hits) and keeps them mergeable; the push trigger
    # above still skips docs, saving minutes on merges.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@75edaf97c1274c4036460d3895dd85f9d7dbc021
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      coverage: false        # coverctl dogfoods its own gate from source (coverage.yml)
      cross-platform: false  # full suite stays on Linux; macOS/Windows smoke is platform-smoke.yml
      # Match this repo's committed nox baseline (.nox/) and go.yml pin.
      # The reusable workflow's default nox is newer and fingerprints differ.
      nox-version: "1.30.1"
      nox-sha256: "e90114e9f37b038af6d2e7f603c5f40684d7a3120f4f377b8a5741aba1b031da"
