# Optional real-toolchain polyglot smoke.
#
# Installs pytest-cov / c8 / cargo-llvm-cov and runs `coverctl check` against
# tiny fixtures under testdata/smoke/. Not on the required branch-protection
# gate — use workflow_dispatch or path-filtered PR runs to exercise runners
# end-to-end. Mocked Detect/buildArgs stay in runners.yml.
# (Node smoke uses c8; the runner also supports nyc/jest.)
name: Polyglot smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "testdata/smoke/**"
      - "internal/infrastructure/runners/**"
      - "internal/infrastructure/parsers/**"
      - ".github/workflows/polyglot-smoke.yml"
  push:
    branches: [main]
    paths:
      - "testdata/smoke/**"
      - "internal/infrastructure/runners/**"
      - "internal/infrastructure/parsers/**"
      - ".github/workflows/polyglot-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [python, nodejs, rust]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build coverctl
        # Binary lands at repo root; smoke steps run from testdata/smoke/<lang>
        # so they invoke ../../../coverctl.
        run: go build -o coverctl ./cmd/coverctl

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pytest-cov
        if: matrix.lang == 'python'
        run: pip install pytest pytest-cov

      - name: Set up Node
        if: matrix.lang == 'nodejs'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: testdata/smoke/nodejs/package.json

      - name: Install c8
        if: matrix.lang == 'nodejs'
        working-directory: testdata/smoke/nodejs
        run: npm install

      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        if: matrix.lang == 'rust'
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov

      - name: coverctl check (python)
        if: matrix.lang == 'python'
        working-directory: testdata/smoke/python
        run: PYTHONPATH=. ../../../coverctl check -l python -p coverage.xml

      - name: coverctl check (nodejs)
        if: matrix.lang == 'nodejs'
        working-directory: testdata/smoke/nodejs
        run: ../../../coverctl check -l javascript -p coverage/lcov.info

      - name: coverctl check (rust)
        if: matrix.lang == 'rust'
        working-directory: testdata/smoke/rust
        run: ../../../coverctl check -l rust -p target/coverage/lcov.info
